plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abhibot.virtualtrading'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abhibot.virtualtrading'
        minSdk 24
        targetSdk 35
        versionCode 20
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
